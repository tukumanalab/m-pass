server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # 本番環境 (ポート3000) -> /members
    location /members/ {
        proxy_pass http://app:3000/members/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /members {
        proxy_pass http://app:3000/members;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # デバッグ環境 (ポート3001) -> /members-debug
    # Note: Next.js handles the /members-debug basePath internally
    # Pass the full path including /members-debug to Next.js (no trailing slash manipulation)
    location /members-debug {
        proxy_pass http://app-debug:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # アップロードファイル配信（本番環境）
    location /members/uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # アップロードファイル配信（デバッグ環境）
    location /members-debug/uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ヘルスチェック
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # カスタムエラーページ（Webサーバー名を表示しない）
    error_page 403 /_error_403.html;
    error_page 404 /_error_404.html;
    error_page 500 502 503 504 /_error_50x.html;

    location = /_error_403.html {
        internal;
        default_type text/html;
        return 403 "<html>\r\n<head><title>403 Forbidden</title></head>\r\n<body>\r\n<center><h1>403 Forbidden</h1></center>\r\n</body>\r\n</html>\r\n";
    }

    location = /_error_404.html {
        internal;
        default_type text/html;
        return 404 "<html>\r\n<head><title>404 Not Found</title></head>\r\n<body>\r\n<center><h1>404 Not Found</h1></center>\r\n</body>\r\n</html>\r\n";
    }

    location = /_error_50x.html {
        internal;
        default_type text/html;
        return 500 "<html>\r\n<head><title>Server Error</title></head>\r\n<body>\r\n<center><h1>Server Error</h1></center>\r\n</body>\r\n</html>\r\n";
    }

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
